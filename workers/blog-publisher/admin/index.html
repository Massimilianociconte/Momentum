<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Momentum · Blog admin</title>
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/toastui-editor.min.css" />
  <link rel="stylesheet" href="https://uicdn.toast.com/editor/3.2.2/theme/toastui-editor-dark.min.css" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <span class="topbar__brand">Momentum <span class="topbar__sub">Blog admin</span></span>
    <div class="topbar__actions" id="topbar-actions" hidden>
      <button class="btn btn--ghost" id="btn-logout" type="button">Esci</button>
    </div>
  </header>

  <main class="main">
    <!-- Login -->
    <section class="view card view--login" id="view-login" hidden>
      <h1>Accesso riservato</h1>
      <p class="muted">Inserisci la password di amministrazione.</p>
      <form id="form-login">
        <input type="password" id="input-password" placeholder="Password"
               autocomplete="current-password" required />
        <button class="btn btn--primary" type="submit" id="btn-login">Entra</button>
      </form>
      <p class="error" id="login-error" hidden>Password errata.</p>
    </section>

    <!-- Lista articoli -->
    <section class="view" id="view-list" hidden>
      <div class="list-head">
        <input type="search" id="input-search" placeholder="Cerca articolo…" />
        <button class="btn btn--primary" id="btn-new" type="button">+ Nuovo</button>
      </div>
      <div id="article-list" class="article-list"></div>
      <p class="muted" id="list-empty" hidden>Nessun articolo. Creane uno con “+ Nuovo”.</p>
    </section>

    <!-- Editor -->
    <section class="view" id="view-editor" hidden>
      <div class="editor-head">
        <button class="btn btn--ghost" id="btn-back" type="button">← Articoli</button>
        <span class="badge" id="editor-status"></span>
      </div>

      <div class="fields">
        <label>Titolo
          <input type="text" id="f-title" placeholder="Titolo dell'articolo" />
        </label>
        <label>Descrizione (meta description)
          <textarea id="f-description" rows="2" maxlength="300"
                    placeholder="Riassunto per Google e anteprime social"></textarea>
          <span class="hint"><span id="desc-count">0</span>/160 caratteri consigliati</span>
        </label>
        <details class="advanced">
          <summary>Campi avanzati (SEO, categoria, tag, copertina)</summary>
          <label>Titolo SEO
            <input type="text" id="f-seo-title" placeholder="Se diverso dal titolo" />
          </label>
          <div class="fields__row">
            <label>Categoria
              <input type="text" id="f-category" placeholder="es. Tecnica" />
            </label>
            <label>Autore
              <input type="text" id="f-author" placeholder="Momentum" />
            </label>
          </div>
          <label>Tag (separati da virgola)
            <input type="text" id="f-tags" placeholder="padel, punteggio" />
          </label>
          <label>Immagine di copertina
            <input type="text" id="f-featured" placeholder="/blog/slug/copertina.jpg" />
          </label>
          <label>Testo alternativo copertina
            <input type="text" id="f-featured-alt" placeholder="Descrizione dell'immagine" />
          </label>
          <div class="gallery" id="gallery"></div>
        </details>
      </div>

      <div id="editor"></div>
      <p class="hint">Incolla o trascina un'immagine nel testo per caricarla automaticamente.</p>

      <div class="editor-actions">
        <button class="btn btn--primary" id="btn-save" type="button">Salva</button>
        <button class="btn" id="btn-publish" type="button">Pubblica</button>
        <button class="btn btn--danger" id="btn-delete" type="button">Elimina</button>
      </div>
      <p class="status" id="save-status" hidden></p>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>

  <script src="https://uicdn.toast.com/editor/3.2.2/toastui-editor-all.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
