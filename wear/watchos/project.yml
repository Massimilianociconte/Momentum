# XcodeGen spec di supporto per il companion watchOS.
#
#   brew install xcodegen
#   cd wear/watchos && xcodegen generate
#   open RallyMateWatch.xcodeproj
#
# Il target distribuito è incorporato anche nel progetto Flutter iOS tramite
# scripts/sync_watchos_target.rb. Questa spec resta utile per build isolate.
#
# Nota brand: display name utente = Momentum; path/target tecnici restano
# RallyMate* per non rompere sync Xcode / bundle id com.rallymate.*.
name: RallyMateWatch
options:
  bundleIdPrefix: com.rallymate
  deploymentTarget:
    watchOS: "10.0"
packages:
  RallyMateCore:
    path: RallyMateCore
targets:
  RallyMateWatchApp:
    type: application
    platform: watchOS
    sources:
      - RallyMateWatchApp
    dependencies:
      - package: RallyMateCore
        product: RallyMateCore
      - package: RallyMateCore
        product: RallyMateWatchKit
    info:
      path: RallyMateWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Momentum
        WKApplication: true
        WKWatchOnly: false
        WKSupportsAlwaysOnDisplay: true
        WKCompanionAppBundleIdentifier: com.rallymate.rallymate
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: Momentum legge battito e calorie durante una partita per mostrare metriche live sul polso.
        NSHealthUpdateUsageDescription: Momentum salva la sessione workout della partita su Apple Health solo con il tuo consenso.
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rallymate.rallymate.watchkitapp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: RallyMateWatchApp/RallyMateWatchApp.entitlements
