# XcodeGen spec di supporto per il companion watchOS.
#
#   brew install xcodegen
#   cd wear/watchos && xcodegen generate
#   open MomentumWatch.xcodeproj
#
# Il target distribuito è incorporato anche nel progetto Flutter iOS tramite
# scripts/sync_watchos_target.rb. Questa spec resta utile per build isolate.
#
# Nota brand: cartelle, package Swift e target sono Momentum*. Restano invece
# sul namespace storico `com.rallymate.*` i SOLI identificatori registrati
# presso gli store e presso il sistema operativo: bundleIdPrefix,
# PRODUCT_BUNDLE_IDENTIFIER e WKCompanionAppBundleIdentifier. Cambiarli
# significherebbe pubblicare una app nuova e scollegare il companion dal
# telefono: non farlo.
name: MomentumWatch
options:
  bundleIdPrefix: com.rallymate
  deploymentTarget:
    watchOS: "10.0"
packages:
  MomentumCore:
    path: MomentumCore
targets:
  MomentumWatchApp:
    type: application
    platform: watchOS
    sources:
      - MomentumWatchApp
    dependencies:
      - package: MomentumCore
        product: MomentumCore
      - package: MomentumCore
        product: MomentumWatchKit
    info:
      path: MomentumWatchApp/Info.plist
      properties:
        CFBundleDisplayName: Momentum
        WKApplication: true
        WKWatchOnly: false
        WKSupportsAlwaysOnDisplay: true
        WKCompanionAppBundleIdentifier: com.rallymate.rallymate
        WKRunsIndependentlyOfCompanionApp: false
        NSHealthShareUsageDescription: Momentum legge battito e calorie durante una partita per mostrare metriche live sul polso.
        NSHealthUpdateUsageDescription: Momentum salva la sessione workout della partita su Apple Health solo con il tuo consenso.
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rallymate.rallymate.watchkitapp
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MomentumWatchApp/MomentumWatchApp.entitlements
